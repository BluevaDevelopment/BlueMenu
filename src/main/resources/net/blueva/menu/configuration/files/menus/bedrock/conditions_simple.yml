menuName: "&b&lConditional Simple Form"
type: SIMPLE
openCommand: /simpleconditional

content:
  - "&7Welcome to the conditional menu!"
  - "&7Buttons shown depend on your stats"
  - ""
  - "&eYour level: {player_level}"
  - "&eYour health: {player_health}"

buttons:
  # Button only shown if player level >= 10
  level_button:
    text: "&6Level 10+ Options"
    image: "https://example.com/diamond.png"
    display_conditions:
      - "{player_level} >= 10"
    actions:
      - "MESSAGE;&aYou clicked the level 10+ button!"

  # Button only shown if player health > 10
  health_button:
    text: "&cHealthy Options"
    display_conditions:
      - "{player_health} > 10"
    actions:
      - "MESSAGE;&aYou're healthy!"

  # Button with multiple conditions
  advanced_button:
    text: "&eAdvanced Options"
    display_conditions:
      - "{player_level} >= 5"
      - "{player_health} >= 8"
    actions:
      - "MESSAGE;&eYou have advanced access!"

  # Button with boolean operators
  boolean_button:
    text: "&dBoolean Test"
    display_conditions:
      - "({player_level} >= 10) && ({player_health} > 5)"
    actions:
      - "MESSAGE;&dBoolean condition passed!"

  # Button with all/any/none conditions
  complex_button:
    text: "&5Complex Conditions"
    display_conditions:
      all:
        - "{player_level} >= 5"
        - "{player_health} >= 8"
      any:
        - "{player_level} >= 20"
        - "{player_health} >= 15"
      none:
        - "{player_level} == 99"
    actions:
      - "MESSAGE;&5Complex conditions passed!"

  # Always visible button
  close_button:
    text: "&cClose"
    actions:
      - "MESSAGE;&7Menu closed"
