# ====================================
# TELEPORT FORM - Practical Example
# ====================================
# This example shows a custom teleport form

menuName: "<gradient:#5555ff:#00aaff>Teleport</gradient>"
type: CUSTOM
openCommand: /tpform

components:

  title_label:
    type: LABEL
    text: "<bold><gold>Teleport System</gold></bold>"

  description:
    type: LABEL
    text: "<gray>Select your destination and configure options"

  # World selector
  world_selector:
    type: DROPDOWN
    text: "<aqua>Destination world:"
    options:
      - "Overworld"
      - "Nether"
      - "End"
      - "Lobby"
    default: 0
    actions:
      - "CONSOLE;say World selected: {value}"

  # X coordinate
  coord_x:
    type: INPUT
    text: "<yellow>X Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Y coordinate
  coord_y:
    type: SLIDER
    text: "<yellow>Y Coordinate (height):"
    min: -64
    max: 320
    step: 1
    default: 64
    actions: []

  # Z coordinate
  coord_z:
    type: INPUT
    text: "<yellow>Z Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Save location
  save_location:
    type: TOGGLE
    text: "<green>Save this location as favorite?"
    default: false
    actions:
      - "MESSAGE;<aqua>Save location: {value}"

  # Teleport mode
  tp_mode:
    type: STEPSLIDER
    text: "<red>Teleport mode:"
    steps:
      - "Instant"
      - "With effects"
      - "With countdown"
    default: 0
    actions:
      - "CONSOLE;tp {player_name} {coord_x} {coord_y} {coord_z}"
      - "MESSAGE;<green>Teleport successful! Mode: {value}"
