# ====================================
# CUSTOM MENU - BlueMenu Example
# ====================================
# Este es un ejemplo de menú CUSTOM que muestra TODOS los componentes disponibles
# Los formularios CUSTOM soportan: dropdown, input, toggle, slider, stepSlider y label

menuName: "<gradient:#00d4ff:#0099ff><bold>Custom Form Example</gradient>"
type: CUSTOM
openCommand: /customform

# Componentes del formulario
# Cada componente puede tener acciones que se ejecutan cuando el jugador envía el formulario
# Puedes usar {value} en las acciones para obtener el valor seleccionado/ingresado por el jugador
components:

  # LABEL - Muestra texto informativo (no tiene valor de respuesta)
  label1:
    type: LABEL
    text: "<gold><bold>Bienvenido al formulario personalizado!</bold></gold>"
    # Los labels no tienen acciones ya que son solo informativos

  label2:
    type: LABEL
    text: "<gray>Por favor completa el siguiente formulario:"

  # INPUT - Campo de texto donde el jugador puede escribir
  player_name:
    type: INPUT
    text: "<aqua>¿Cómo te llamas?"
    placeholder: "Ingresa tu nombre aquí..."
    default: ""
    actions:
      - "MESSAGE;<green>Tu nombre es: {value}"
      - "CONSOLE;say El jugador ingresó: {value}"

  # DROPDOWN - Menú desplegable con opciones predefinidas
  favorite_color:
    type: DROPDOWN
    text: "<yellow>Selecciona tu color favorito:"
    options:
      - "<red>Rojo"
      - "<blue>Azul"
      - "<green>Verde"
      - "<yellow>Amarillo"
      - "<light_purple>Morado"
    default: 0  # Índice de la opción por defecto (0 = primera opción)
    actions:
      - "MESSAGE;<gold>Seleccionaste la opción #{value}"
      - "CONSOLE;say Color seleccionado: índice {value}"

  # TOGGLE - Interruptor on/off (true/false)
  accept_terms:
    type: TOGGLE
    text: "<gray>¿Aceptas los términos y condiciones?"
    default: false
    actions:
      - "MESSAGE;<aqua>Tu respuesta fue: {value}"

  # SLIDER - Barra deslizante con valores numéricos
  experience_level:
    type: SLIDER
    text: "<green>¿Cuál es tu nivel de experiencia? (0-100)"
    min: 0
    max: 100
    step: 5
    default: 50
    actions:
      - "MESSAGE;<yellow>Tu nivel de experiencia es: {value}"
      - "CONSOLE;xp add {player_name} {value} levels"

  # STEPSLIDER - Deslizador por pasos con opciones de texto
  difficulty:
    type: STEPSLIDER
    text: "<red>Selecciona la dificultad:"
    steps:
      - "Fácil"
      - "Normal"
      - "Difícil"
      - "Extremo"
    default: 1  # Índice del step por defecto (1 = "Normal")
    actions:
      - "MESSAGE;<gold>Dificultad seleccionada: índice {value}"
      - "CONSOLE;difficulty {value}"

  # Otro ejemplo de INPUT con placeholder diferente
  email:
    type: INPUT
    text: "<blue>Correo electrónico (opcional):"
    placeholder: "ejemplo@correo.com"
    default: ""
    actions:
      - "MESSAGE;<green>Email registrado: {value}"

  # Otro ejemplo de TOGGLE
  newsletter:
    type: TOGGLE
    text: "<aqua>¿Deseas recibir noticias del servidor?"
    default: true
    actions:
      - "MESSAGE;<yellow>Newsletter: {value}"

  # LABEL final
  final_label:
    type: LABEL
    text: "<gradient:#ff0000:#ffaa00>Gracias por completar el formulario!</gradient>"

# ====================================
# NOTAS IMPORTANTES:
# ====================================
# 1. Los componentes se procesan en el orden en que aparecen en este archivo
# 2. Puedes usar el placeholder {value} en las acciones para obtener el valor del componente
# 3. Los valores de {value} por tipo:
#    - DROPDOWN: índice de la opción seleccionada (0, 1, 2, ...)
#    - INPUT: el texto que ingresó el jugador
#    - TOGGLE: "true" o "false"
#    - SLIDER: valor numérico (ej: 25.0, 50.0, 75.5)
#    - STEPSLIDER: índice del step seleccionado (0, 1, 2, ...)
#    - LABEL: no tiene valor
# 4. Las acciones disponibles son:
#    - MESSAGE;texto - Envía un mensaje al jugador
#    - PLAYER;comando - Ejecuta un comando como el jugador
#    - CONSOLE;comando - Ejecuta un comando desde la consola
#    - CLOSE - Cierra el menú (no requiere valor después de ;)
# 5. Puedes usar todos los placeholders de MiniMessage y PlaceholderAPI
