# ====================================
# CUSTOM MENU - BlueMenu Example
# ====================================
# This is an example of a CUSTOM menu showing ALL available components
# CUSTOM forms support: dropdown, input, toggle, slider, stepSlider and label

menuName: "<gradient:#00d4ff:#0099ff><bold>Custom Form Example</gradient>"
type: CUSTOM
openCommand: /customform

# Form components
# Each component can have actions that execute when the player submits the form
# You can use {value} in actions to get the selected/entered value by the player
components:

  # LABEL - Displays informational text (no response value)
  label1:
    type: LABEL
    text: "<gold><bold>Welcome to the custom form!</bold></gold>"
    # Labels don't have actions as they are informational only

  label2:
    type: LABEL
    text: "<gray>Please complete the following form:"

  # INPUT - Text field where the player can type
  player_name:
    type: INPUT
    text: "<aqua>What's your name?"
    placeholder: "Enter your name here..."
    default: ""
    actions:
      - "MESSAGE;<green>Your name is: {value}"
      - "CONSOLE;say Player entered: {value}"

  # DROPDOWN - Dropdown menu with predefined options
  favorite_color:
    type: DROPDOWN
    text: "<yellow>Select your favorite color:"
    options:
      - "<red>Red"
      - "<blue>Blue"
      - "<green>Green"
      - "<yellow>Yellow"
      - "<light_purple>Purple"
    default: 0  # Index of default option (0 = first option)
    actions:
      - "MESSAGE;<gold>You selected option #{value}"
      - "CONSOLE;say Color selected: index {value}"

  # TOGGLE - On/off switch (true/false)
  accept_terms:
    type: TOGGLE
    text: "<gray>Do you accept the terms and conditions?"
    default: false
    actions:
      - "MESSAGE;<aqua>Your answer was: {value}"

  # SLIDER - Sliding bar with numeric values
  experience_level:
    type: SLIDER
    text: "<green>What's your experience level? (0-100)"
    min: 0
    max: 100
    step: 5
    default: 50
    actions:
      - "MESSAGE;<yellow>Your experience level is: {value}"
      - "CONSOLE;xp add {player_name} {value} levels"

  # STEPSLIDER - Step slider with text options
  difficulty:
    type: STEPSLIDER
    text: "<red>Select difficulty:"
    steps:
      - "Easy"
      - "Normal"
      - "Hard"
      - "Extreme"
    default: 1  # Index of default step (1 = "Normal")
    actions:
      - "MESSAGE;<gold>Difficulty selected: index {value}"
      - "CONSOLE;difficulty {value}"

  # Another INPUT example with different placeholder
  email:
    type: INPUT
    text: "<blue>Email (optional):"
    placeholder: "example@email.com"
    default: ""
    actions:
      - "MESSAGE;<green>Email registered: {value}"

  # Another TOGGLE example
  newsletter:
    type: TOGGLE
    text: "<aqua>Do you want to receive server news?"
    default: true
    actions:
      - "MESSAGE;<yellow>Newsletter: {value}"

  # Final LABEL
  final_label:
    type: LABEL
    text: "<gradient:#ff0000:#ffaa00>Thank you for completing the form!</gradient>"

# ====================================
# IMPORTANT NOTES:
# ====================================
# 1. Components are processed in the order they appear in this file
# 2. You can use the {value} placeholder in actions to get the component's value
# 3. The {value} values by type:
#    - DROPDOWN: index of selected option (0, 1, 2, ...)
#    - INPUT: text entered by the player
#    - TOGGLE: "true" or "false"
#    - SLIDER: numeric value (e.g: 25.0, 50.0, 75.5)
#    - STEPSLIDER: index of selected step (0, 1, 2, ...)
#    - LABEL: no value
# 4. Available actions are:
#    - MESSAGE;text - Sends a message to the player
#    - PLAYER;command - Executes a command as the player
#    - CONSOLE;command - Executes a command from console
#    - CLOSE - Closes the menu (no value required after ;)
# 5. You can use all MiniMessage and PlaceholderAPI placeholders
