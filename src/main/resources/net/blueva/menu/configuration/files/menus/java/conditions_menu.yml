menuName: "&b&lConditional Menu"
menuSize: 54
type: CHEST
openCommand: /conditionalmenu

items:
  # Item only shown if player level is >= 10
  level_item:
    name: "&6Level 10+ Item"
    slot: 10
    itemStack:
      material: DIAMOND
      amount: 1
    lore:
      - "&7Only visible if level >= 10"
      - "&7Your level: {player_level}"
    display_conditions:
      - "{player_level} >= 10"
    actions:
      - "[LEFT_CLICK] MESSAGE;&aYou have level 10 or higher!"
      - "[RIGHT_CLICK] MESSAGE;&aYou have level 10 or higher!"

  # Item only shown if player health > 10
  healthy_item:
    name: "&cHealthy Player"
    slot: 11
    itemStack:
      material: GOLDEN_APPLE
      amount: 1
    lore:
      - "&7Only visible if health > 10"
      - "&7Your health: {player_health}"
    display_conditions:
      - "{player_health} > 10"
    actions:
      - "[LEFT_CLICK] MESSAGE;&aYou're healthy!"
      - "[RIGHT_CLICK] MESSAGE;&aYou're healthy!"

  # Item with multiple conditions (ALL must pass)
  advanced_item:
    name: "&eAdvanced Item"
    slot: 12
    itemStack:
      material: EMERALD
      amount: 1
    lore:
      - "&7Requires level >= 5 AND health >= 8"
      - "&7Level: {player_level}"
      - "&7Health: {player_health}"
    display_conditions:
      - "{player_level} >= 5"
      - "{player_health} >= 8"
    actions:
      - "[LEFT_CLICK] MESSAGE;&aYou meet both requirements!"
      - "[RIGHT_CLICK] MESSAGE;&aYou meet both requirements!"

  # Item with boolean operators
  boolean_item:
    name: "&dBoolean Example"
    slot: 13
    itemStack:
      material: NETHER_STAR
      amount: 1
    lore:
      - "&7Shown if (level >= 10) AND (health > 5)"
    display_conditions:
      - "({player_level} >= 10) && ({player_health} > 5)"
    actions:
      - "[LEFT_CLICK] MESSAGE;&dYou passed the boolean check!"
      - "[RIGHT_CLICK] MESSAGE;&dYou passed the boolean check!"

  # Item with negation
  low_level_item:
    name: "&7Low Level Item"
    slot: 14
    itemStack:
      material: WOODEN_SWORD
      amount: 1
    lore:
      - "&7Only shown when level is NOT 50"
    display_conditions:
      - "! ({player_level} == 50)"
    actions:
      - "[LEFT_CLICK] MESSAGE;&7You're not level 50!"

  # Item with math operators
  math_item:
    name: "&aMath Example"
    slot: 15
    itemStack:
      material: REDSTONE
      amount: 1
    lore:
      - "&7Shown if level * 2 >= 20"
      - "&7Your level: {player_level}"
    display_conditions:
      - "{player_level} * 2 >= 20"
    actions:
      - "[LEFT_CLICK] MESSAGE;&aMath condition passed!"
      - "[RIGHT_CLICK] MESSAGE;&aMath condition passed!"

  # Item with string comparison
  name_item:
    name: "&bName Check"
    slot: 16
    itemStack:
      material: NAME_TAG
      amount: 1
    lore:
      - "&7Shown if name starts with 'A'"
    display_conditions:
      - "{player_name} startsWith 'A'"
    actions:
      - "[LEFT_CLICK] MESSAGE;&bYour name starts with A!"
      - "[RIGHT_CLICK] MESSAGE;&bYour name starts with A!"

  # Item with all/any/none conditions
  complex_item:
    name: "&5Complex Conditions"
    slot: 20
    itemStack:
      material: ENCHANTED_BOOK
      amount: 1
    lore:
      - "&7Uses all/any/none logic"
      - "&7All: level >= 5 AND health >= 8"
      - "&7Any: high level OR high health"
      - "&7None: not level 99"
    display_conditions:
      all:     # All must be true
        - "{player_level} >= 5"
        - "{player_health} >= 8"
      any:     # At least one must be true
        - "{player_level} >= 20"
        - "{player_health} >= 15"
      none:    # None of them must be true
        - "{player_level} == 99"
    actions:
      - "[LEFT_CLICK] MESSAGE;&5Complex conditions passed!"
      - "[RIGHT_CLICK] MESSAGE;&5Complex conditions passed!"

  # Another all/any/none example
  vip_item:
    name: "&6VIP Access"
    slot: 21
    itemStack:
      material: GOLD_BLOCK
      amount: 1
    lore:
      - "&7All: level 10+ AND health > 5"
      - "&7Any: name starts with A/B/C"
      - "&7None: not level 1"
    display_conditions:
      all:
        - "{player_level} >= 10"
        - "{player_health} > 5"
      any:
        - "{player_name} startsWith 'A'"
        - "{player_name} startsWith 'B'"
        - "{player_name} startsWith 'C'"
      none:
        - "{player_level} == 1"
    actions:
      - "[LEFT_CLICK] MESSAGE;&6VIP access granted!"
      - "[RIGHT_CLICK] MESSAGE;&6VIP access granted!"

  # Always visible item (no conditions)
  always_visible:
    name: "&fAlways Visible"
    slot: 40
    itemStack:
      material: BARRIER
      amount: 1
    lore:
      - "&7This item has no conditions"
      - "&7So it's always visible"
    actions:
      - "[LEFT_CLICK] CLOSE"
      - "[RIGHT_CLICK] CLOSE"
