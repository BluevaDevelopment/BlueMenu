menuName: "<gradient:#5555ff:#00aaff>Teleport System</gradient>"
type: CUSTOM
openCommand: /tpform

components:

  title_label:
    type: LABEL
    text: "<bold><gold>Teleport System</gold></bold>"

  description:
    type: LABEL
    text: "<gray>Enter coordinates to teleport"

  # X coordinate
  coord_x:
    type: INPUT
    text: "<yellow>X Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Y coordinate
  coord_y:
    type: SLIDER
    text: "<yellow>Y Coordinate (height):"
    min: -64
    max: 320
    step: 1
    default: 64
    actions: []

  # Z coordinate
  coord_z:
    type: INPUT
    text: "<yellow>Z Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Confirm toggle - This component executes the final action
  confirm_tp:
    type: TOGGLE
    text: "<green>Confirm teleport?"
    default: false
    actions:
      - "MESSAGE;<aqua>Coordinates: X={coord_x} Y={coord_y} Z={coord_z}"
      - "MESSAGE;<aqua>Confirm: {confirm_tp}"
      - "CONSOLE;tp {player_name} {coord_x} {coord_y} {coord_z}"
      - "MESSAGE;<green>Teleport successful!"

# ====================================
# NOTES:
# ====================================
# This form demonstrates cross-component placeholders:
# - {coord_x}, {coord_y}, {coord_z} - Coordinates from different inputs
# - {confirm_tp} - Toggle value
# - {player_name} - Standard placeholder
#
# All actions are executed when the form is submitted, and all component
# values are available to all actions via placeholders.
