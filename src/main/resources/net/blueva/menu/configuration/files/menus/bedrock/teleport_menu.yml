menuName: "<gradient:#5555ff:#00aaff>Teleport</gradient>"
type: CUSTOM
openCommand: /tpform

components:

  title_label:
    type: LABEL
    text: "<bold><gold>Teleport System</gold></bold>"

  description:
    type: LABEL
    text: "<gray>Select your destination and configure options"

  # World selector
  world_selector:
    type: DROPDOWN
    text: "<aqua>Destination world:"
    options:
      - "world"
      - "world_nether"
      - "world_the_end"
    default: 0
    actions: []  # No action needed here, we'll use it in final actions

  # X coordinate
  coord_x:
    type: INPUT
    text: "<yellow>X Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Y coordinate
  coord_y:
    type: SLIDER
    text: "<yellow>Y Coordinate (height):"
    min: -64
    max: 320
    step: 1
    default: 64
    actions: []

  # Z coordinate
  coord_z:
    type: INPUT
    text: "<yellow>Z Coordinate:"
    placeholder: "0"
    default: "0"
    actions: []

  # Save location toggle
  save_location:
    type: TOGGLE
    text: "<green>Save this location as favorite?"
    default: false
    actions: []

  # Teleport mode - This component executes the final action
  tp_mode:
    type: STEPSLIDER
    text: "<red>Teleport mode:"
    steps:
      - "Instant"
      - "With effects"
      - "With countdown"
    default: 0
    actions:
      - "MESSAGE;<aqua>Teleporting to world: {world_selector_text}"
      - "MESSAGE;<aqua>Coordinates: {coord_x}, {coord_y}, {coord_z}"
      - "MESSAGE;<aqua>Mode: {tp_mode_text}"
      - "MESSAGE;<aqua>Save location: {save_location}"
      - "CONSOLE;execute in {world_selector_text} run tp {player_name} {coord_x} {coord_y} {coord_z}"
      - "MESSAGE;<green>Teleport successful!"

# ====================================
# NOTES:
# ====================================
# This form demonstrates cross-component placeholders:
# - {world_selector_text} - Selected world name
# - {coord_x}, {coord_y}, {coord_z} - Coordinates from different inputs
# - {save_location} - Toggle value
# - {tp_mode_text} - Selected teleport mode
#
# All actions are executed when the form is submitted, and all component
# values are available to all actions via placeholders.
