menuName: "&b&lConditional Custom Form"
type: CUSTOM
openCommand: /customconditional

components:
  # Always visible label
  header:
    type: LABEL
    text: "&7Fill out the form below"

  # Another label showing player stats
  stats_label:
    type: LABEL
    text: "&eLevel: {player_level} | Health: {player_health}"

  # Input only shown if player level >= 10
  level_input:
    type: INPUT
    text: "&6Message (Level 10+ only)"
    placeholder: "Enter your message..."
    default: ""
    display_conditions:
      - "{player_level} >= 10"
    actions:
      - "MESSAGE;&aYour message: {level_input}"

  # Dropdown only shown if player level >= 5
  options_dropdown:
    type: DROPDOWN
    text: "&eSelect Option (Level 5+)"
    options:
      - "Option 1"
      - "Option 2"
      - "Option 3"
    default: 0
    display_conditions:
      - "{player_level} >= 5"
    actions:
      - "MESSAGE;&aYou selected: {options_dropdown_text}"

  # Toggle only shown if player health > 10
  health_toggle:
    type: TOGGLE
    text: "&cHealthy Feature (Health > 10)"
    default: false
    display_conditions:
      - "{player_health} > 10"
    actions:
      - "MESSAGE;&cHealthy feature: {health_toggle}"

  # Slider with multiple conditions
  power_slider:
    type: SLIDER
    text: "&dPower Level (Lvl 5+ & HP 8+)"
    min: 0
    max: 100
    step: 10
    default: 50
    display_conditions:
      - "{player_level} >= 5"
      - "{player_health} >= 8"
    actions:
      - "MESSAGE;&dPower set to: {power_slider}"

  # Step slider with boolean condition
  difficulty_steps:
    type: STEPSLIDER
    text: "&6Difficulty"
    steps:
      - "Easy"
      - "Normal"
      - "Hard"
    default: 1
    display_conditions:
      - "({player_level} >= 10) && ({player_health} > 5)"
    actions:
      - "MESSAGE;&6Difficulty: {difficulty_steps_text}"

  # Slider with all/any/none conditions
  advanced_slider:
    type: SLIDER
    text: "&5Advanced Slider"
    min: 0
    max: 50
    step: 5
    default: 25
    display_conditions:
      all:
        - "{player_level} >= 5"
        - "{player_health} >= 8"
      any:
        - "{player_level} >= 20"
        - "{player_health} >= 15"
      none:
        - "{player_level} == 1"
    actions:
      - "MESSAGE;&5Advanced value: {advanced_slider}"

  # Always visible toggle
  accept:
    type: TOGGLE
    text: "&aAccept Terms"
    default: false
    actions:
      - "MESSAGE;&aAccepted: {accept}"
