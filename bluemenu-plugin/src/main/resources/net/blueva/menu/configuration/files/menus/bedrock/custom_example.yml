file_version: 1

menuName: "<aqua><bold>Custom Form Example"
type: CUSTOM
openCommand: /custommenu

# Form components
# Each component can have actions that execute when the player submits the form
# You can use {component_key} placeholders to access any component's value
# Special placeholders:
#   {component_key} - Gets the value/index of the component
#   {component_key_text} - Gets the selected text for DROPDOWN and STEPSLIDER
components:

  # LABEL - Displays informational text (no response value)
  label1:
    type: LABEL
    text: "<gold><bold>Welcome to the custom form!</bold></gold>"

  label2:
    type: LABEL
    text: "<gray>Please complete the following form:"

  # INPUT - Text field where the player can type
  player_name:
    type: INPUT
    text: "<aqua>What's your name?"
    placeholder: "Enter your name here..."
    default: ""
    actions:
      - "MESSAGE;<green>Your name is: {player_name}"
      - "CONSOLE;say Player entered: {player_name}"

  # DROPDOWN - Dropdown menu with predefined options
  favorite_color:
    type: DROPDOWN
    text: "<yellow>Select your favorite color:"
    options:
      - "Red"
      - "Blue"
      - "Green"
      - "Yellow"
      - "Purple"
    default: 0
    actions:
      - "MESSAGE;<gold>You selected option #{favorite_color}: {favorite_color_text}"
      - "CONSOLE;say Color selected: {favorite_color_text}"

  # TOGGLE - On/off switch (true/false)
  accept_terms:
    type: TOGGLE
    text: "<gray>Do you accept the terms and conditions?"
    default: false
    actions:
      - "MESSAGE;<aqua>Terms accepted: {accept_terms}"

  # SLIDER - Sliding bar with numeric values
  experience_level:
    type: SLIDER
    text: "<green>What's your experience level? (0-100)"
    min: 0
    max: 100
    step: 5
    default: 50
    actions:
      - "MESSAGE;<yellow>Your experience level is: {experience_level}"

  # STEPSLIDER - Step slider with text options
  difficulty:
    type: STEPSLIDER
    text: "<red>Select difficulty:"
    steps:
      - "peaceful"
      - "easy"
      - "normal"
      - "hard"
    default: 2
    actions:
      - "MESSAGE;<gold>Difficulty selected: {difficulty_text}"
      - "CONSOLE;difficulty {difficulty_text}"

  # Another INPUT example
  email:
    type: INPUT
    text: "<blue>Email (optional):"
    placeholder: "example@email.com"
    default: ""
    actions:
      - "MESSAGE;<green>Email registered: {email}"

  # Another TOGGLE example
  newsletter:
    type: TOGGLE
    text: "<aqua>Do you want to receive server news?"
    default: true
    actions:
      - "MESSAGE;<yellow>Newsletter: {newsletter}"

  # Final LABEL - Shows summary using all component values
  final_label:
    type: LABEL
    text: "<gold>Thank you for completing the form!"

# ====================================
# IMPORTANT NOTES:
# ====================================
# 1. Components are processed in the order they appear in this file
# 2. You can use {component_key} placeholders to access any component's value:
#    - {player_name} = text entered in the "player_name" INPUT
#    - {favorite_color} = index selected in the "favorite_color" DROPDOWN
#    - {favorite_color_text} = text of the selected option in DROPDOWN
#    - {accept_terms} = "true" or "false" from the TOGGLE
#    - {experience_level} = numeric value from the SLIDER
#    - {difficulty} = index from the STEPSLIDER
#    - {difficulty_text} = text of the selected step in STEPSLIDER
# 3. Component value formats by type:
#    - DROPDOWN: {key} = index (0, 1, 2...), {key_text} = selected option text
#    - INPUT: {key} = text entered by the player
#    - TOGGLE: {key} = "true" or "false"
#    - SLIDER: {key} = numeric value (integer if whole number, float otherwise)
#    - STEPSLIDER: {key} = index (0, 1, 2...), {key_text} = selected step text
#    - LABEL: no value (informational only)
# 4. Available actions:
#    - MESSAGE;text - Sends a message to the player
#    - PLAYER;command - Executes a command as the player
#    - CONSOLE;command - Executes a command from console
#    - CLOSE - Closes the menu
# 5. You can also use PlaceholderAPI placeholders like %player_name%
# 6. All actions from all components are executed when the form is submitted
