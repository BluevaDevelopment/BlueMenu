# ====================================
# CONDITIONAL SIMPLE FORM EXAMPLE (Bedrock Edition)
# ====================================
# This example demonstrates how to use display_conditions with SIMPLE forms.
# Buttons are shown or hidden based on conditions using placeholders.
#
# Available condition syntaxes:
# 1. Simple list: All conditions in the list must be true (AND logic)
# 2. Boolean operators: Use && (AND), || (OR), ! (NOT) in expressions
# 3. all/any/none: Advanced logic grouping
#    - all: All conditions must be true
#    - any: At least one condition must be true
#    - none: None of the conditions must be true

file_version: 1

menuName: "<aqua><bold>Conditional Simple Form"
type: SIMPLE
openCommand: /simpleconditional

# Content displayed in the form
# You can use placeholders like {player_level}, {player_health}, etc.
content:
  - "<gray>Welcome to the conditional menu!"
  - "<gray>Buttons shown depend on your stats"
  - ""
  - "<yellow>Your level: {player_level}"
  - "<yellow>Your health: {player_health}"

# Button definitions with various condition examples
buttons:
  # EXAMPLE 1: Simple single condition
  # This button only appears if the player's level is 10 or higher
  level_button:
    text: "<gold>Level 10+ Options"
    image: "https://example.com/diamond.png"
    display_conditions:
      - "{player_level} >= 10"  # Single condition check
    actions:
      - "MESSAGE;<green>You clicked the level 10+ button!"

  # EXAMPLE 2: Another simple condition
  # This button only appears if the player has more than 10 health
  health_button:
    text: "<red>Healthy Options"
    display_conditions:
      - "{player_health} > 10"  # Health check
    actions:
      - "MESSAGE;<green>You're healthy!"

  # EXAMPLE 3: Multiple conditions (AND logic)
  # All conditions in the list must be true for the button to appear
  advanced_button:
    text: "<yellow>Advanced Options"
    display_conditions:
      - "{player_level} >= 5"    # Condition 1
      - "{player_health} >= 8"   # Condition 2
    actions:
      - "MESSAGE;<yellow>You have advanced access!"

  # EXAMPLE 4: Boolean operators
  # Using && (AND), || (OR), ! (NOT) in a single expression
  boolean_button:
    text: "<light_purple>Boolean Test"
    display_conditions:
      - "({player_level} >= 10) && ({player_health} > 5)"  # Combined with AND
    actions:
      - "MESSAGE;<light_purple>Boolean condition passed!"

  # EXAMPLE 5: Advanced all/any/none logic
  # Demonstrates complex conditional logic with multiple groups
  complex_button:
    text: "<dark_purple>Complex Conditions"
    display_conditions:
      all:     # All of these must be true
        - "{player_level} >= 5"
        - "{player_health} >= 8"
      any:     # At least one of these must be true
        - "{player_level} >= 20"
        - "{player_health} >= 15"
      none:    # None of these must be true
        - "{player_level} == 99"
    actions:
      - "MESSAGE;<dark_purple>Complex conditions passed!"

  # EXAMPLE 6: Button without conditions
  # This button is always visible to all players
  close_button:
    text: "<red>Close"
    actions:
      - "MESSAGE;<gray>Menu closed"
