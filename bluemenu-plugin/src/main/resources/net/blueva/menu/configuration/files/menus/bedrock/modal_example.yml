file_version: 1

# ====================================
# MODAL FORM EXAMPLE (Bedrock Edition)
# ====================================
# This is a basic example of a MODAL form for Bedrock players.
# MODAL forms display a title, content lines, and exactly 2 buttons.
#
# IMPORTANT: According to FloodgateAPI, MODAL forms support ONLY 2 buttons.
# The first button is typically used for confirmation/acceptance.
# The second button is typically used for cancellation/rejection.

menuName: "<gold>Example"  # The title shown at the top of the modal dialog
type: MODAL                # Form type: MODAL displays a dialog with exactly 2 buttons
openCommand: /menu         # Command to open this menu

# Content lines displayed in the modal dialog
content:
  - "<aqua>Sample text"
  - "Line 2"

# Button definitions (MODAL forms require exactly 2 buttons)
buttons:
  # First button (usually for confirmation/yes/accept)
  button1:
    text: "<green>Test 1"
    actions:
      - "CONSOLE;say You selected Button 1!"  # Execute console command
      - "PLAYER;spawn"                         # Execute player command
      - "MESSAGE;test"                         # Send message to player

  # Second button (usually for cancellation/no/decline)
  button2:
    text: "<green>Test 2"
    actions:
      - "CONSOLE;say You selected Button 2!"
      - "PLAYER;spawn"
      - "MESSAGE;test"