name: BlueMenu
main: net.blueva.menu.Main
version: 1.2.0
api-version: 1.21
softdepend:
  - PlaceholderAPI

libraries:
  - "dev.dejvokep:boosted-yaml:1.3.7"
  - "net.kyori:adventure-api:4.24.0"
  - "net.kyori:adventure-platform-bukkit:4.4.1"
  - "net.kyori:adventure-text-minimessage:4.24.0"
  - "com.zaxxer:HikariCP:5.1.0"
  - "com.mysql:mysql-connector-j:8.3.0"

commands:
  bluemenu:
    description: Main command
    aliases:
      - bm
      - menu
      - menus

permissions:
  bluemenu.admin:
    description: Access to all BlueMenu commands
    default: op
  bluemenu.editor:
    description: Access to the web editor
    default: op
  bluemenu.open:
    description: Open menus for self or others
    default: true
