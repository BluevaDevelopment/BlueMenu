# ====================================
# ANIMATIONS
# ====================================
# Animations allow you to create dynamic, changing items in your menu.
# Each animation cycles through multiple frames at a specified interval.
#
# Structure:
# - interval: Time in ticks between frame changes (20 ticks = 1 second)
# - frames: List of item states to cycle through
#
# This example creates a border animation with colored glass panes
animations:
  # Border animation slot 0 (top-left corner)
  animation1:
    interval: 2  # Change frame every 2 ticks (0.1 seconds)
    frames:
      frame1:
        name: "&f"
        actions: []
        slot: 0
        itemStack:
          material: BLACK_STAINED_GLASS_PANE
          amount: 1
      frame2:
