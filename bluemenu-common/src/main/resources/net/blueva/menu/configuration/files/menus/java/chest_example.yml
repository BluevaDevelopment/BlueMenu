file_version: 1

# ====================================
# CHEST MENU EXAMPLE (Java Edition)
# ====================================
# This is a complete example of a CHEST menu for Java players.
# It demonstrates:
# - Basic menu structure with items
# - Player head items with custom textures (base64 values)
# - Click actions (LEFT_CLICK, RIGHT_CLICK, SHIFT_LEFT_CLICK, SHIFT_RIGHT_CLICK, MIDDLE_CLICK, BOTH, BOTH_SHIFT, ALL)
# - Animated items using frames
# - Using gradients and colors in names/lore
# - open_actions fired when the menu is opened
#
# Menu size options: 9, 18, 27, 36, 45, 54 (multiples of 9)

menuName: '      <bold><gradient:#55FFFF:#5555FF>BlueMenu</gradient></bold> <gray>- <reset>Example'
menuSize: 54           # 6 rows (54 slots)
type: CHEST            # Standard inventory menu type
openCommand: /menu     # Command to open this menu

# Actions fired immediately when the menu opens
open_actions:
  - "MESSAGE;&b&lBlueMenu &r&7— Thanks for checking out the example menu!"

# Static menu items
items:
  # Central logo item with custom player head texture
  item1:
    name: "<bold><gradient:#55FFFF:#5555FF>BlueMenu</gradient></bold>"
    slot: 22  # Center slot in the menu
    itemStack:
      material: PLAYER_HEAD
      amount: 1
      value: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTc4NDRhNDU1NGY5MzYzZDY1OTkwNmQ2MzEyODE4YTExMjJhMWY5YTkyYTIzMjYyYjFlNjc3MDIyMzJiYjcifX19  # Base64 texture value
